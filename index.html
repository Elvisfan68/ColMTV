<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTV Pirate Satellite - Invidious Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=VT323&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050505; display: flex; justify-content: center; align-items: center; font-family: sans-serif; overflow: hidden; }
        
        /* THE TV HARDWARE */
        .tv-frame { position: relative; width: 95vw; height: 53.4vw; max-width: 1000px; max-height: 562px; background: #1a1a1a; border: 15px solid #222; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; }
        #yt-player { width: 100%; height: 100%; pointer-events: none; transform: scale(1.1); }

        /* THE DEBUG LOG (Bottom of screen) */
        #debug-log { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #0f0; font-family: 'VT323', monospace; padding: 10px; font-size: 14px; z-index: 100; border-radius: 5px; pointer-events: none; max-width: 250px; }

        /* OVERLAYS */
        #power-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 150; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #power-btn { padding: 20px 40px; font-family: 'Anton', sans-serif; font-size: 28px; background: #cc0000; color: white; border: none; border-bottom: 6px solid #660000; cursor: pointer; border-radius: 5px; }
        #power-btn:active { transform: translateY(4px); border-bottom: 2px solid #660000; }
        
        #fade-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 50; opacity: 1; transition: opacity 1s; pointer-events: none; }
        .crt-static { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: url('https://media.giphy.com/media/oEI9uWUic9Zf2/giphy.gif'); opacity: 0.03; z-index: 60; pointer-events: none; }

        /* MTV INFO */
        .mtv-box { position: absolute; bottom: 30px; left: 30px; z-index: 70; opacity: 0; transition: opacity 0.5s; }
        .mtv-box.visible { opacity: 1; }
        .mtv-logo { font-family: 'Anton', sans-serif; font-size: 30px; color: #ff0055; text-shadow: 2px 2px #fff; }
        .mtv-text { background: rgba(0,0,0,0.8); padding: 10px; border-left: 5px solid #00f3ff; color: white; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="tv-frame">
        <div id="debug-log">SYSTEM IDLE...</div>

        <div id="power-screen">
            <button id="power-btn">POWER ON TV</button>
            <p style="color: #444; margin-top: 20px; font-family: 'VT323';">SATELLITE SYNC ACTIVE</p>
        </div>

        <div id="yt-player"></div>
        <div id="fade-screen"></div>
        <div class="crt-static"></div>

        <div id="mtv-box" class="mtv-box">
            <div class="mtv-logo">M<span style="color:#00f3ff">TV</span></div>
            <div class="mtv-text">
                <div id="artist" style="font-weight:bold; text-transform:uppercase;">Searching...</div>
                <div id="track" style="font-style:italic;">Please wait</div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://my-spotify-history-logs.s3.amazonaws.com/spotify_logs/master_history.csv';
        const SLOT_DURATION = 240; 
        
        // Using a public Invidious instance (if it fails, we can swap this URL easily)
        const INVIDIOUS_INSTANCE = 'https://vid.puffyan.us/api/v1/search?q=';
        
        let songLibrary = [];
        let player;
        let currentSlotId = null;

        function log(msg) {
            const l = document.getElementById('debug-log');
            l.innerHTML = `> ${msg}<br>${l.innerHTML}`.split('<br>').slice(0, 5).join('<br>');
            console.log(msg);
        }

        // 1. LOAD CSV
        async function loadLibrary() {
            try {
                log("FETCHING CSV...");
                const res = await fetch(CSV_URL);
                const text = await res.text();
                const lines = text.trim().split('\n');
                songLibrary = lines.slice(1).map(line => {
                    const p = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { artist: p[1]?.replace(/"/g,''), track: p[3]?.replace(/"/g,'') };
                }).filter(s => s.artist && s.track);
                log(`CSV LOADED: ${songLibrary.length} SONGS`);
            } catch (e) {
                log("CRITICAL ERROR: CSV FAILED");
            }
        }

        // 2. BACKWOODS SEARCH (Invidious API)
        async function getYoutubeID(query) {
            try {
                log(`SEARCHING: ${query.substring(0, 15)}...`);
                const res = await fetch(INVIDIOUS_INSTANCE + encodeURIComponent(query));
                const data = await res.json();
                
                if (data && data.length > 0) {
                    log(`VIDEO FOUND: ${data[0].videoId}`);
                    return data[0].videoId;
                }
                log("NO VIDEO FOUND IN SEARCH");
                return "M7lc1UVf-VE"; // API Test video
            } catch (e) {
                log("SEARCH ERROR (PROXY DOWN)");
                return "M7lc1UVf-VE";
            }
        }

        // 3. YOUTUBE PLAYER
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                videoId: 'M7lc1UVf-VE',
                playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1, 'rel': 0, 'playsinline': 1 },
                events: { 'onReady': () => log("PLAYER READY") }
            });
        }

        // 4. THE SYNC LOGIC (Yes, it keeps everyone synced!)
        async function syncBroadcast() {
            // Math: Seconds since Jan 1 1970 divided by duration = slot ID
            // Every person in the world on this site gets the EXACT same slot ID
            const now = Math.floor(Date.now() / 1000);
            const slot = Math.floor(now / SLOT_DURATION);
            const seek = now % SLOT_DURATION;

            if (currentSlotId !== slot) {
                currentSlotId = slot;
                log(`NEW SLOT: ${slot} | SEEK: ${seek}s`);

                // Picking the same song for everyone based on slot math
                const index = Math.abs(slot * 13) % songLibrary.length;
                const song = songLibrary[index];

                document.getElementById('fade-screen').style.opacity = '1';

                const vidId = await getYoutubeID(`${song.artist} ${song.track} official music video`);
                
                player.loadVideoById({ videoId: vidId, startSeconds: seek });
                player.playVideo(); // Force play for iOS hack
                
                updateUI(song.artist, song.track);
                setTimeout(() => document.getElementById('fade-screen').style.opacity = '0', 2000);
            }
        }

        function updateUI(a, t) {
            document.getElementById('artist').textContent = a;
            document.getElementById('track').textContent = `"${t}"`;
            const box = document.getElementById('mtv-box');
            box.classList.add('visible');
            setTimeout(() => box.classList.remove('visible'), 8000);
        }

        // INITIALIZE
        document.getElementById('power-btn').addEventListener('click', () => {
            document.getElementById('power-screen').style.display = 'none';
            log("POWERING ON...");
            player.playVideo(); // Unlock iOS audio permissions
            syncBroadcast();
            setInterval(syncBroadcast, 3000); // Check for slot changes every 3s
        });

        loadLibrary();
    </script>
</body>
</html>
