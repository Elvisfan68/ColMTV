<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pirate MTV - No API Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap');

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0a0a0a; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Roboto', sans-serif; overflow: hidden;
        }

        /* --- THE TV HARDWARE --- */
        .tv-frame {
            position: relative; width: 92vw; height: 51.75vw;
            max-width: 1100px; max-height: 618px; 
            background: #1a1a1a;
            border: 25px solid #222; 
            border-top-color: #333; border-left-color: #333;
            border-radius: 30px;
            box-shadow: inset 0 0 40px #000, 0 30px 60px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        .screen { position: relative; width: 100%; height: 100%; background: #000; }
        
        /* Slight scale up to hide YouTube player chrome/logos */
        #yt-player { width: 100%; height: 100%; pointer-events: none; transform: scale(1.1); }

        /* --- OVERLAYS --- */
        #fade-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 25; opacity: 1; pointer-events: none;
            transition: opacity 1.5s ease-in-out;
        }

        .crt-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none; z-index: 10;
        }

        /* --- THE POWER BUTTON SCREEN --- */
        #power-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; display: flex;
            justify-content: center; align-items: center;
        }

        #power-btn {
            padding: 25px 50px; font-size: 32px; font-family: 'Anton', sans-serif;
            background: #d40000; color: #fff; border-radius: 8px;
            border: none; border-bottom: 8px solid #7a0000; border-right: 8px solid #7a0000;
            border-top: 4px solid #ff4d4d; border-left: 4px solid #ff4d4d;
            cursor: pointer; text-shadow: 2px 2px 0px #000;
            transition: all 0.1s;
        }

        #power-btn:active {
            transform: translate(4px, 4px);
            border-bottom: 4px solid #4a0000; border-right: 4px solid #4a0000;
        }

        /* --- MTV LOWER THIRDS --- */
        .mtv-info {
            position: absolute; bottom: 40px; left: 40px; z-index: 20;
            color: white; opacity: 0; transition: opacity 0.5s;
            text-shadow: 2px 2px 0px #000;
        }

        .mtv-info.visible { opacity: 1; }

        .mtv-logo {
            font-family: 'Anton', sans-serif; font-size: 38px; color: #ff0055;
            letter-spacing: -2px; text-shadow: 2px 2px 0px #fff, 4px 4px 0px #000;
        }

        .mtv-text {
            background: rgba(0, 0, 0, 0.8); padding: 10px 15px;
            border-left: 6px solid #00f3ff; margin-top: 5px;
        }

        /* --- CONTROL DECK --- */
        .controls {
            margin-top: 40px; display: flex; gap: 20px;
            background: #222; padding: 15px 30px; border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border-bottom: 5px solid #000;
        }

        .btn-chunky {
            background: #333; color: #eee; padding: 10px 20px; border: none;
            border-bottom: 4px solid #111; border-radius: 4px; 
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="tv-frame">
        <div id="power-screen">
            <button id="power-btn">POWER ON TV</button>
        </div>

        <div class="screen">
            <div id="yt-player"></div>
            <div id="fade-screen"></div>
            <div class="crt-overlay"></div>
            
            <div id="mtv-info" class="mtv-info">
                <div class="mtv-logo">M<span style="color:#00f3ff">TV</span></div>
                <div class="mtv-text">
                    <div id="info-artist" style="font-size: 24px; font-weight: bold;">SYNCING...</div>
                    <div id="info-track" style="font-size: 18px; font-style: italic; color: #ccc;">Satellite Search</div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-chunky" onclick="location.reload()">RE-TUNE</button>
        <div style="color: #666; align-self: center; font-family: monospace;">CH. 05</div>
    </div>

    <script>
        const CSV_URL = 'https://my-spotify-history-logs.s3.amazonaws.com/spotify_logs/master_history.csv';
        const SLOT_DURATION = 240; 
        let songLibrary = [];
        let player;
        let currentSlotId = null;

        // --- THE "BACKWOODS" SEARCH ENGINE ---
        // Scrapes YouTube results via a CORS proxy. No API key needed.
        async function fetchYoutubeId(query) {
            try {
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(searchUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const html = data.contents;
                
                // This regex scans the HTML source for the first valid video ID
                const regex = /"videoId":"([a-zA-Z0-9_-]{11})"/;
                const match = html.match(regex);
                
                return match ? match[1] : "dQw4w9WgXcQ"; // Return ID or Rickroll fallback
            } catch (err) {
                console.error("Search failed:", err);
                return "2Nq2X2xOaE0"; // Fallback to a commercial
            }
        }

        // --- YOUTUBE PLAYER SETUP ---
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                videoId: 'M7lc1UVf-VE', // Dummy video for the iOS unlock
                playerVars: { 
                    'autoplay': 0, 'controls': 0, 'modestbranding': 1, 
                    'rel': 0, 'disablekb': 1, 'playsinline': 1 
                },
                events: { 'onReady': () => console.log("TV Ready") }
            });
        }

        // --- CORE LOGIC ---
        async function init() {
            // Load CSV
            const res = await fetch(CSV_URL);
            const text = await res.text();
            const lines = text.trim().split('\n');
            songLibrary = lines.slice(1).map(line => {
                const p = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return { artist: p[1]?.replace(/"/g,''), track: p[3]?.replace(/"/g,'') };
            });

            // Handle Power On
            document.getElementById('power-btn').addEventListener('click', () => {
                document.getElementById('power-screen').style.display = 'none';
                
                // THE IOS UNLOCK: Play dummy video immediately on click
                player.playVideo();
                
                syncBroadcast();
                setInterval(syncBroadcast, 2000); // Check for channel changes every 2s
            });
        }

        async function syncBroadcast() {
            const now = Math.floor(Date.now() / 1000);
            const slot = Math.floor(now / SLOT_DURATION);
            const seek = now % SLOT_DURATION;

            if (currentSlotId !== slot) {
                currentSlotId = slot;
                
                // Use a deterministic seed so everyone gets the same song
                const index = Math.abs(slot * 7919) % songLibrary.length;
                const song = songLibrary[index];

                // Visual Transition
                document.getElementById('fade-screen').style.opacity = '1';
                
                // Backwoods Search
                const vidId = await fetchYoutubeId(`${song.artist} ${song.track} official music video`);
                
                player.loadVideoById({ videoId: vidId, startSeconds: seek });
                updateGraphics(song.artist, song.track);

                setTimeout(() => {
                    document.getElementById('fade-screen').style.opacity = '0';
                }, 1500);
            }
        }

        function updateGraphics(a, t) {
            document.getElementById('info-artist').textContent = a;
            document.getElementById('info-track').textContent = `"${t}"`;
            const box = document.getElementById('mtv-info');
            box.classList.add('visible');
            setTimeout(() => box.classList.remove('visible'), 10000);
        }

        init();
    </script>
</body>
</html>
