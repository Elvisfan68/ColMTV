<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pirate MTV</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: 'Roboto', sans-serif; overflow: hidden; color: white; }
        
        /* THE TV FRAME */
        .tv-frame { position: relative; width: 90vw; height: 50.625vw; max-width: 1000px; max-height: 562px; background: #000; border: 15px solid #2a2a2a; border-radius: 15px; box-shadow: 0 0 50px rgba(0,0,0,0.9); overflow: hidden; }
        .screen { position: relative; width: 100%; height: 100%; background: #050505; }
        #yt-player { width: 100%; height: 100%; pointer-events: none; transform: scale(1.1); } /* Scale hides YT logo bits */
        
        /* OVERLAYS */
        #fade-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 25; opacity: 1; transition: opacity 1.2s; pointer-events: none; }
        .crt-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 3px, 3px 100%; pointer-events: none; z-index: 10; }

        /* THE CHUNKY BUTTON */
        #power-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 50; display: flex; justify-content: center; align-items: center; }
        #power-btn { padding: 20px 40px; font-size: 24px; font-family: 'Anton', sans-serif; background: #cc0000; color: #fff; border: none; border-bottom: 6px solid #660000; border-radius: 5px; cursor: pointer; }
        #power-btn:active { transform: translateY(4px); border-bottom: 2px solid #660000; }

        /* SONG INFO */
        .mtv-info { position: absolute; bottom: 30px; left: 30px; z-index: 30; opacity: 0; transition: opacity 0.5s; text-shadow: 2px 2px 4px #000; }
        .mtv-info.visible { opacity: 1; }
        .mtv-logo { font-family: 'Anton', sans-serif; font-size: 32px; color: #ff0055; }
        .mtv-text { background: rgba(0,0,0,0.7); padding: 8px 12px; border-left: 4px solid #00f3ff; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="tv-frame">
        <div id="power-screen">
            <button id="power-btn">POWER ON TV</button>
        </div>

        <div class="screen">
            <div id="yt-player"></div>
            <div id="fade-screen"></div>
            <div class="crt-overlay"></div>
            
            <div id="mtv-info" class="mtv-info">
                <div class="mtv-logo">M<span style="color:#00f3ff">TV</span></div>
                <div class="mtv-text">
                    <div id="info-artist" style="font-weight:bold; font-size:20px;">LOADING...</div>
                    <div id="info-track" style="font-style:italic; color:#ccc;">Satellite Search...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://my-spotify-history-logs.s3.amazonaws.com/spotify_logs/master_history.csv';
        const SLOT_DURATION = 240; 
        let songLibrary = [];
        let player;
        let currentSlotId = null;

        // --- THE BACKWOODS SEARCH ENGINE ---
        // This scrapes YouTube's internal search suggest or results using a proxy
        async function getYoutubeId(query) {
            try {
                const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
                // Using a public CORS proxy to grab the HTML
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(searchUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const html = data.contents;
                
                // Regex to find the first video ID in the YouTube results page source
                const regex = /"videoId":"([a-zA-Z0-9_-]{11})"/;
                const match = html.match(regex);
                return match ? match[1] : "dQw4w9WgXcQ"; // Fallback to Rickroll if search fails
            } catch (e) {
                return "2Nq2X2xOaE0"; // Fallback to a commercial
            }
        }

        // Standard YT Player setup (still need the player, just not the Search API)
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                videoId: 'M7lc1UVf-VE', // Test video
                playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1, 'rel': 0, 'disablekb': 1, 'playsinline': 1 },
                events: { 'onReady': () => document.getElementById('power-btn').disabled = false }
            });
        }

        async function init() {
            const res = await fetch(CSV_URL);
            const text = await res.text();
            const lines = text.trim().split('\n');
            songLibrary = lines.slice(1).map(line => {
                const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return { artist: parts[1]?.replace(/"/g,''), track: parts[3]?.replace(/"/g,'') };
            });

            document.getElementById('power-btn').addEventListener('click', () => {
                document.getElementById('power-screen').style.display = 'none';
                player.playVideo(); // iOS Unlock
                syncTV();
                setInterval(syncTV, 2000);
            });
        }

        async function syncTV() {
            const now = Math.floor(Date.now() / 1000);
            const slot = Math.floor(now / SLOT_DURATION);
            const seek = now % SLOT_DURATION;

            if (currentSlotId !== slot) {
                currentSlotId = slot;
                const song = songLibrary[Math.abs(slot * 7) % songLibrary.length];
                
                document.getElementById('fade-screen').style.opacity = '1';
                
                const videoId = await getYoutubeId(`${song.artist} ${song.track} official music video`);
                
                player.loadVideoById({ videoId: videoId, startSeconds: seek });
                updateUI(song.artist, song.track);
                
                setTimeout(() => { document.getElementById('fade-screen').style.opacity = '0'; }, 1500);
            }
        }

        function updateUI(a, t) {
            document.getElementById('info-artist').textContent = a;
            document.getElementById('info-track').textContent = `"${t}"`;
            const info = document.getElementById('mtv-info');
            info.classList.add('visible');
            setTimeout(() => info.classList.remove('visible'), 8000);
        }

        init();
    </script>
</body>
</html>
